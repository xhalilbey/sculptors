name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository: nothing here pushes, comments or
# releases, and the migrations step only diffs drizzle/ against the commit.
# Without this block the job token gets the repository's default
# permissions, which can include write.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # No later step talks to the remote, so the token is not left in
      # .git/config for every npm script and dependency to read.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The same major as local development and the Dockerfile, and inside
      # package.json's engines range. Intl output differs between engines
      # (see 883a449), so tests should run on the Node the app ships on.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails on a high or critical advisory in a runtime dependency, the
      # packages the Docker image ships. Dev-only advisories do not fail it.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Fails when a state-changing route handler is added without a guard.
      # See scripts/check-route-guards.mjs for the allowed exceptions.
      - name: Route guards
        run: npm run check:routes

      # The migration journal is consistent and the schema has no change
      # without a generated migration. The build needs no database: the app
      # connects lazily, and migrations run as a separate deploy step.
      - name: Migrations
        run: |
          npm run db:check
          npm run db:generate
          git diff --exit-code drizzle/
          test -z "$(git status --porcelain drizzle/)"

      # Authorization tests, plus the database tests: the real migrations on
      # in-process PGlite, RLS coverage, and every identity query shape.
      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Build-time only. The app validates real values at runtime; these
          # exist so `next build` can complete without production secrets.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SCULPTORS_OWNER_WORKOS_USER_ID: ci_placeholder
